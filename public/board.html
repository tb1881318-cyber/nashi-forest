<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><script src="desk-navigation.js"></script><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><script defer src="content.js"></script><script defer src="session.js"></script><title>公共台 · 纳什森林</title><script defer src="announcer.js"></script><script defer src="board.js"></script></head><body><header class="top"><div class="wrap"><a class="brand" href="index.html">♠ 纳什森林</a><nav class="actions desk-nav" aria-label="三个台"><a href="host.html">主持人台</a><a href="player.html">玩家台</a><a href="board.html">公共台</a><a href="calculator.html">均衡计算器</a><a href="index.html">规则</a></nav></div></header>
<main class="wrap board-main"><header class="page-head split"><div><div class="eyebrow">LIVE TABLE</div><h1 id="heading">森林公共台</h1><p id="status" role="status">正在连接对局</p></div><div class="actions"><button id="previewVoice">试听播报</button><button id="enableVoice" aria-pressed="false">开启语音</button><button id="fullscreen">全屏</button></div></header><p id="controlAccess" class="notice" role="status"></p><a id="controlJump" class="primary" href="#controls" hidden>拍卖与轮次管理</a><p id="actionStatus" class="notice" role="status"></p><section class="panel board-entry" id="boardEntry"><form id="openBoard" class="split"><label>对局号<input id="boardRoom" inputmode="numeric" pattern="([0-9]{4}|[0-9]{6})" maxlength="6" placeholder="输入四位对局号" required></label><button class="primary">进入公共台</button></form><button id="continueBoard" class="top-gap" hidden>继续上次对局</button></section><div id="boardContent" hidden><section class="panel top-gap" id="roundAuction"><h2 id="auctionHeading">本轮拍卖</h2><div id="auctionPreview"></div></section><details id="controls" hidden class="board-tools top-gap"><summary>拍卖与轮次管理</summary><div class="stack"><section class="panel" hidden><h2>主持人备用捕食</h2><p>双方在各自玩家台秘密选择。全部锁定后自动揭晓、结算。</p><form id="hunt"><div class="fieldrow"><label>发起者 A<select id="a" required></select></label><label>目标 B<select id="b" required></select></label></div><button class="primary top-gap" id="huntButton">发起捕食</button></form></section><section class="panel"><h2>本轮拍卖</h2><form id="auction"><div class="fieldrow"><label>物品<select id="item"><option value="0">本轮技能卡</option><option value="1">生命补给</option></select></label><label>买家<select id="buyer" required></select></label><label>成交金币<input id="price" type="number" min="0" step="1" required></label></div><div class="actions top-gap"><button>记录成交</button><button type="button" id="unsold">流拍</button></div></form><p id="sales"></p></section></div><div class="stack"><section class="panel" id="utilityPanel" hidden><h2>森林权杖</h2><div id="scepter" hidden><label>权杖指定先手<select id="first"></select></label><button id="useScepter">指定先手</button></div></section><section class="panel"><h2>轮次结算</h2><button class="primary" id="next">结束本轮并结算</button><p id="result" class="notice"></p></section><details class="fold"><summary>调整 HP 与金币</summary><div><p>用于技能、契约及放弃捕食的结算。</p><form id="adjust"><label>玩家<select id="adjustSeat"></select></label><div class="fieldrow"><label>当前 HP<input id="hp" type="number" step="1" required></label><label>当前金币<input id="coins" type="number" min="0" step="1" required></label></div><button class="top-gap">保存</button></form></div></details><details class="fold"><summary>金币设置</summary><div><form id="settings"><label>新入场玩家初始金币<input id="initial" type="number" value="10" min="0" required></label><label>每轮补贴<input id="stipend" type="number" value="5" min="0" required></label><button class="top-gap">保存</button></form></div></details></div></details><div class="duo"><section class="panel"><h2>起始座位</h2><div class="board-number" id="drawn">—</div><p id="order">等待摇号</p><div id="drawControls" class="actions" hidden><button id="draw">随机起始座位</button></div></section><section class="panel"><h2>谈判剩余时间</h2><div class="board-number" id="clock">04:00</div><p id="phase"></p><div id="timerControls" class="actions" hidden><button id="timer">开始谈判</button><button id="resetTimer">重置为4分钟</button></div></section></div><section class="panel top-gap"><h2 id="settlementTitle">场上玩家</h2><div id="seats" class="board-seats"></div></section><section class="panel top-gap"><h2>本场捕食</h2><p>按摇号顺序由玩家在个人台选目标、发起捕食。</p><div id="latest" class="latest-fight">等待捕食</div><p id="duelProgress" aria-live="polite"></p><button id="cancelHunt" hidden>取消本场</button></section><section class="panel top-gap"><h2>逐轮战报</h2><ol id="history" class="history"></ol></section></div></main></body></html>
