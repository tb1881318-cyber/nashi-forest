<main class="wrap"><header class="page-head"><div class="eyebrow">PLAYER</div><h1>玩家台</h1></header><section class="panel private-card"><form id="join"><label id="roomField">对局号<input id="room" inputmode="numeric" pattern="([0-9]{4}|[0-9]{6})" maxlength="6" placeholder="输入四位对局号" required></label><label>我的 ID<input id="id" maxlength="16" autocomplete="nickname" required placeholder="输入昵称"></label><button class="primary top-gap" id="register">注册并分配身份</button></form><div id="hand" hidden><h2 id="name"></h2><p id="seat"></p><div class="identity-card" id="identity">♠</div><button id="reveal">盖回身份</button><p id="hp" class="personal-hp" aria-live="polite"></p><section id="duelPanel" class="duel-panel" hidden><h3 id="duelTitle"></h3><p id="duelHint"></p><form id="strategyForm"><div class="strategy-options"><label><input type="radio" name="tactic" value="0" required>进攻</label><label><input type="radio" name="tactic" value="1" required>反击</label></div><button class="primary top-gap" id="lockStrategy">锁定策略</button></form><p id="strategyStatus" class="notice" aria-live="polite"></p></section><div class="hp-history"><h3>每轮生命值</h3><table><thead><tr><th>轮次</th><th>开局</th><th>拍卖后</th><th>当前 / 轮末</th></tr></thead><tbody id="hpHistory"></tbody></table></div><section class="personal-encounters"><h3>我的逐轮交手</h3><div id="encounters"></div></section><a class="button" id="board">查看公共台</a></div><p id="status" class="notice" role="status"></p></section></main></body></html>
